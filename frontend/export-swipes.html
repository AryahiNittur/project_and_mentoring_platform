<!DOCTYPE html>
<html>
<head>
    <title>Export Swipes to CSV</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 0; cursor: pointer; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .count { color: #7055dc; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Bridge Swipe Data Exporter</h1>

    <button onclick="showSwipes()">Show All Swipes</button>
    <button onclick="downloadCSV()">Download as CSV</button>
    <button onclick="clearSwipes()">Clear All Swipes</button>

    <div id="output"></div>

    <script>
        function getSwipes() {
            const state = JSON.parse(localStorage.getItem('bridge-v1') || '{}');
            return state.swipes || [];
        }

        function showSwipes() {
            const swipes = getSwipes();
            const output = document.getElementById('output');

            if (swipes.length === 0) {
                output.innerHTML = '<p>No swipes recorded yet. Go swipe some projects!</p>';
                return;
            }

            output.innerHTML = `
                <h2>Recorded Swipes: <span class="count">${swipes.length}</span></h2>
                <pre>${JSON.stringify(swipes, null, 2)}</pre>
            `;
        }

        function downloadCSV() {
            const swipes = getSwipes();

            if (swipes.length === 0) {
                alert('No swipes to export. Go swipe some projects first!');
                return;
            }

            // Create CSV header
            let csv = 'student_id,project_id,action,score,created_at\n';

            // Add rows
            swipes.forEach(swipe => {
                csv += `${swipe.student_id},${swipe.project_id},${swipe.action},${swipe.score},${swipe.created_at}\n`;
            });

            // Download
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bridge-swipes-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);

            alert(`Downloaded ${swipes.length} swipe records to CSV!`);
        }

        function clearSwipes() {
            if (!confirm('Are you sure you want to clear all swipe records?')) return;

            const state = JSON.parse(localStorage.getItem('bridge-v1') || '{}');
            state.swipes = [];
            localStorage.setItem('bridge-v1', JSON.stringify(state));

            document.getElementById('output').innerHTML = '<p style="color: green;">Swipes cleared!</p>';
        }

        // Auto-show on load
        window.onload = showSwipes;
    </script>
</body>
</html>
