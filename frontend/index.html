<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Bridge — Build together. Give back.</title>

        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <aside>
            <div class="logo">
                <span class="symbol">∩∩</span>
                <em style="font-style: normal">
                    bridge<span class="purple">.</span>
                </em>
            </div>

            <div class="sub">YOUR WORKSPACE</div>

            <!-- app.js generates the navigation here. -->
            <nav id="nav" aria-label="Main navigation"></nav>

            <div class="sidebarfoot">
                <div class="campus">
                    ◈ &nbsp; Built for Buckeyes
                    <b>Big ideas. Better together.</b>
                    <span style="color: #999">Ohio State University</span>
                </div>

                <div class="user">
                    <div class="avatar">B</div>
                    <div>
                        <b>Bridge workspace</b>
                        <small>Learn and build together</small>
                    </div>
                </div>
            </div>
        </aside>

        <main>
            <header>
                <div>
                    <b>Community workspace</b>
                    <br />
                    <small>
                        Ohio State University &nbsp; / &nbsp;
                        <span id="crumb">Overview</span>
                    </small>
                </div>

                <div class="topright">
                    <span class="status">
                        <span class="dot">●</span>
                        &nbsp; Local demo
                    </span>

                    <button
                        class="avatar"
                        type="button"
                        title="Edit preferences"
                        aria-label="Edit preferences"
                        onclick="openOnboarding()"
                    >
                        B
                    </button>
                </div>
            </header>

            <!-- app.js renders the dashboard and project cards here. -->
            <div id="view">
                <div class="empty" role="status">
                    <h3>Loading your workspace…</h3>
                </div>
            </div>

            <p class="helpnote">
                HackOHI/O · Honda Bridge Builder · Sample community data
            </p>
        </main>

        <!-- Survey and other dialogs appear here. -->
        <div id="overlay"></div>

        <!-- Status notifications appear here. -->
        <div id="toast" aria-live="polite"></div>

        <noscript>
            Please enable JavaScript to use the Bridge dashboard.
        </noscript>

        <!-- Load the matching functions before the dashboard. -->
        <script src="matching/rank.js"></script>
        <script src="app.js"></script>
    </body>
</html>
